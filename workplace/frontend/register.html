<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Planner - 新規登録</title>

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Study Planner</h1>

            <h2>新規登録</h2>

            <form id="registerForm">

                <label for="registerName">
                    名前
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="名前を入力"
                    required
                >


                <label for="registerEmail">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="メールアドレス"
                    required
                >


                <label for="registerPassword">
                    パスワード
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="パスワードを入力"
                    required
                >


                <p id="registerError"
                   class="error-message">
                </p>


                <button type="submit">
                    新規登録
                </button>

            </form>


            <p class="switch-page">

                すでにアカウントを持っていますか？

                <a href="login.html">
                    ログインはこちら
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
