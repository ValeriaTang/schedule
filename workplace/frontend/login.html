<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン - Schedule App</title>
  <link rel="stylesheet" href="css/auth.css">

  <!-- Google SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/common-auth.js" defer></script>
  <script src="js/google-auth.js" defer></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Schedule App</h1>
      <h2>ログイン</h2>

      <!-- FedCM のブラウザ制限エラーを回避するため ux_mode="popup" を明示 -->
      <div
        id="g_id_onload"
        data-client_id="1067955587484-jiuifljib05r35bfj25orgjucl2ctjbe.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_select="false"
        data-ux_mode="popup">
      </div>

      <div class="google-login">
        <div
          class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-theme="outline">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
