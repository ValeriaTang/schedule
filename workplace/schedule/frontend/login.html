<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Planner - ログイン</title>

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Study Planner</h1>

            <h2>ログイン</h2>

            <form id="loginForm">

                <label for="loginEmail">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="メールアドレス"
                    required
                >


                <label for="loginPassword">
                    パスワード
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="パスワード"
                    required
                >


                <p id="loginError"
                   class="error-message">
                </p>


                <button type="submit">
                    ログイン
                </button>

            </form>


            <p class="switch-page">

                アカウントを持っていませんか？

                <a href="register.html">
                    新規登録はこちら
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
